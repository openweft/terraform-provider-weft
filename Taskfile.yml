version: '3'

vars:
  PLUGIN_DIR: "~/.terraform.d/plugins/registry.terraform.io/openweft/weft/0.1.0/darwin_arm64"

tasks:
  build:
    desc: "Build the provider binary"
    cmds:
      - go build -mod=mod -o terraform-provider-weft .

  test:
    desc: "Run unit tests"
    cmds:
      - go test -mod=mod -cover ./...

  acceptance:
    desc: "Run acceptance tests against a live weft daemon (requires WEFT_SOCKET)"
    cmds:
      - |
        if [ -z "$WEFT_SOCKET" ]; then
          echo "WEFT_SOCKET not set — point it at a live weft daemon, e.g."
          echo "  export WEFT_SOCKET=unix:///tmp/acc-weft/weft.sock"
          echo "Skipping acceptance suite."
          exit 0
        fi
        TF_ACC=1 go test -tags acceptance -timeout 30m -count=1 ./internal/provider/...

  lint:
    desc: "Vet the provider"
    cmds:
      - go vet -mod=mod ./...

  install:
    desc: "Install provider for local Terraform dev (~/.terraform.d/plugins/…)"
    cmds:
      - mkdir -p "{{.PLUGIN_DIR}}"
      - go build -mod=mod -o "{{.PLUGIN_DIR}}/terraform-provider-weft" .
      - echo "Installed to {{.PLUGIN_DIR}}"

  docs:
    desc: "Regenerate provider docs from schemas + examples/ via tfplugindocs"
    cmds:
      - go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name weft

  release-snapshot:
    desc: "Dry-run a goreleaser release locally (no tag, no publish)"
    cmds:
      - goreleaser release --snapshot --clean
