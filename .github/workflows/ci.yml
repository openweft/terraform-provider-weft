name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: build (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: test
        # Tests run on linux/amd64 only; cross-arch execution needs qemu
        # and we ship a pure-Go provider so native coverage on host arch suffices.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -race -count=1 ./...

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No-op until examples/ lands; the fmt steps auto-activate when it does.
      # hashFiles() is not valid in a job-level `if:`, so the gate lives in a
      # step that publishes an output the later steps key off of.
      - name: Detect examples
        id: detect
        run: |
          if [ -n "$(find examples -type f 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.detect.outputs.present == 'true'
        with:
          terraform_wrapper: false

      - name: terraform fmt
        if: steps.detect.outputs.present == 'true'
        run: terraform fmt -check -recursive examples/
